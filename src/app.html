<!doctype html>
<html lang="%lang%">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.png" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

		<!-- The LCP on every page is text, so the base font subset is the critical
		     dependency. Preloading it starts the woff2 download alongside HTML parsing
		     rather than after app.css parses and its @import chain resolves. -->
		<link
			rel="preload"
			as="font"
			type="font/woff2"
			href="/fonts/interlude/woff2-dynamic-subset/InterludeVariable.subset.base.woff2"
			crossorigin
		/>

		<!-- The full subset sheet (112KB, 118 CJK/symbol faces) is loaded off the
		     critical path — the base face is inlined in app.css, so first paint
		     never blocks on it. `media=print` fetches at low priority, then flips to
		     `all` once it lands; the <noscript> copy keeps the faces for JS-off. -->
		<link
			rel="stylesheet"
			href="/fonts/interlude/interlude-variable-dynamic-subset.css"
			media="print"
			onload="this.media = 'all'"
		/>
		<noscript>
			<link rel="stylesheet" href="/fonts/interlude/interlude-variable-dynamic-subset.css" />
		</noscript>

		<script>
			(() => {
				const root = document.documentElement;
				const mql = window.matchMedia('(prefers-color-scheme: dark)');

				const apply = () => {
					root.classList.toggle('dark', mql.matches);
					root.classList.toggle('light', !mql.matches);
				};

				apply();
				mql.addEventListener('change', apply);
			})();
		</script>

		<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
		<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />

		%sveltekit.head%
	</head>

	<body
		class="mx-auto bg-white text-black subpixel-antialiased dark:bg-neutral-950 dark:text-white"
		data-sveltekit-preload-data="hover"
	>
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
