<!doctype html>
<html lang="%lang%">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.png" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

		<!-- The LCP on every page is text, so the core Interlude file is the
		     critical dependency. Preloading it starts the woff2 download alongside
		     HTML parsing rather than after app.css is parsed. -->
		<!-- @generated interlude:preload -->
		<link
			rel="preload"
			as="font"
			type="font/woff2"
			href="/fonts/interlude/interlude-core.e08f36c6d2.woff2"
			crossorigin
		/>
		<!-- @generated interlude:end -->

		<!-- Upstream's subset sheet, cut down to the long tail the core and
		     extended files do not carry (CJK, rarer symbols). `media=print` fetches
		     it at low priority, then the script below flips it to `all` once it
		     lands — there, not in an `onload` attribute, because the
		     Content-Security-Policy allows exactly one inline script (by hash, in
		     vite.config.ts) and no inline handlers. The <noscript> copy keeps the
		     faces for JS-off. -->
		<link
			rel="stylesheet"
			href="/fonts/interlude/interlude-variable-dynamic-subset.css"
			media="print"
			data-defer-css
		/>
		<noscript>
			<link rel="stylesheet" href="/fonts/interlude/interlude-variable-dynamic-subset.css" />
		</noscript>

		<script>
			(() => {
				const root = document.documentElement;
				const mql = window.matchMedia('(prefers-color-scheme: dark)');

				const apply = () => {
					root.classList.toggle('dark', mql.matches);
				};

				apply();
				mql.addEventListener('change', apply);

				for (const link of document.querySelectorAll('link[data-defer-css]')) {
					const use = () => (link.media = 'all');
					if (link.sheet) use();
					else link.addEventListener('load', use, { once: true });
				}
			})();
		</script>

		<!-- The theme follows the system (the script above), so the browser's own UI
		     — scrollbars, placeholder text, the canvas before CSS lands — should too.
		     Every form control sets its own colours, so this changes nothing else. -->
		<meta name="color-scheme" content="light dark" />
		<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
		<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />

		%sveltekit.head%
	</head>

	<body
		class="mx-auto bg-white text-black subpixel-antialiased dark:bg-neutral-950 dark:text-white"
		data-sveltekit-preload-data="hover"
	>
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
