# Temporary: renders main and this branch in WebKit on macOS (CoreText, the
# engine Safari uses on macOS and iOS), for the font PR. Removed before merge.
name: Safari font rendering

on:
  push:
    branches: [claude/web-font-optimization-d63ror]
    paths: ['.github/apple-fonts/**', '.github/workflows/apple-fonts.yml']

jobs:
  render:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build after (this branch)
        run: |
          cp .env.example .env
          npm run build
      - name: Build before (main)
        run: |
          git worktree add ../before "$(git merge-base HEAD origin/main)"
          cp .env.example ../before/.env
          ln -s "$PWD/node_modules" ../before/node_modules
          cd ../before && npm run build
      - name: Serve both and render
        run: |
          npm i --no-save playwright@1.63.0
          npx playwright install webkit
          (npx vite preview --port 4174 --strictPort > /dev/null 2>&1 &)
          (cd ../before && npx vite preview --port 4180 --strictPort > /dev/null 2>&1 &)
          for p in 4174 4180; do for i in $(seq 1 90); do curl -sf "http://localhost:$p/blog" > /dev/null && break; sleep 2; done; done
          node .github/apple-fonts/render.cjs apple-render
          sw_vers > apple-render/os.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apple-render
          path: apple-render
          retention-days: 7
