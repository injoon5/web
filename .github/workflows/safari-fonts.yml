# Temporary: renders font variants in WebKit on macOS (CoreText, Safari's engine)
# to find why the generated fonts render thin in Safari. Removed before merge.
name: Safari font rendering

on:
  push:
    branches: [claude/web-font-optimization-d63ror]
    paths: ['.github/safari-fonts/**', '.github/workflows/safari-fonts.yml']

jobs:
  render:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Render
        working-directory: .github/safari-fonts
        run: |
          npm init -y > /dev/null
          npm i --no-save playwright@1.63.0
          npx playwright install webkit
          python3 -m http.server 8123 > /dev/null 2>&1 &
          sleep 2
          node render.cjs out
          sw_vers > out/os.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: safari-render
          path: .github/safari-fonts/out
          retention-days: 7
